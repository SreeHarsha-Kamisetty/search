<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Product Search</h1>
      <p class="subtitle">Search across products by name, brand, category & description</p>
    </header>

    <form class="search-form" id="searchForm" role="search">
      <div class="search-row">
        <input
          type="search"
          id="searchInput"
          name="q"
          placeholder="e.g. running shoes, Nike, iPhone…”
          autocomplete="off"
          aria-label="Search products"
        >
        <button type="submit" id="searchBtn">Search</button>
      </div>
      <div class="search-meta">
        <label class="limit-label">
          Results per page
          <select id="limitSelect">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>
    </form>

    <div id="message" class="message" aria-live="polite" hidden></div>
    <div id="loading" class="loading" hidden>Searching…</div>

    <main id="resultsContainer" class="results-container">
      <ul id="resultsList" class="results-list" aria-label="Search results"></ul>
      <div id="pagination" class="pagination" hidden></div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
